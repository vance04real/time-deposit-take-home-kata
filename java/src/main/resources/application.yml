spring:
  application:
    name: time-deposit-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/timedeposit}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: dev

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  packages-to-scan: org.ikigaidigital.application.rest
  paths-to-match: /api/**

logging:
  level:
    org.ikigaidigital: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

# Time Deposit Configuration
time-deposit:
  interest-rates:
    basic:
      annual-rate: 0.01
      min-days: 30
    student:
      annual-rate: 0.03
      min-days: 30
      max-days: 365
    premium:
      annual-rate: 0.05
      min-days: 45