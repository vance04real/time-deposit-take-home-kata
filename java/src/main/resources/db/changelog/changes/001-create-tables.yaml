databaseChangeLog:
  - changeSet:
      id: 1
      author: time-deposit-system
      changes:
        - createTable:
            tableName: time_deposits
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: days
                  type: INTEGER
                  constraints:
                    nullable: false

  - changeSet:
      id: 2
      author: time-deposit-system
      changes:
        - createTable:
            tableName: withdrawals
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: time_deposit_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: date
                  type: DATE
                  constraints:
                    nullable: false

  - changeSet:
      id: 3
      author: time-deposit-system
      changes:
        - addForeignKeyConstraint:
            baseTableName: withdrawals
            baseColumnNames: time_deposit_id
            constraintName: FK_withdrawals_time_deposit
            referencedTableName: time_deposits
            referencedColumnNames: id
            onDelete: CASCADE